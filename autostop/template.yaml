AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  L180 auto-stop. An hourly EventBridge rule runs a Lambda that stops client environments (EC2 and RDS) once everything
  running in them has been up for the configured number of hours. Deploys in DRY-RUN mode by default.

Parameters:
  ClientsJson:
    Type: String
    Description: >-
      Same shape as the control panel's clients.json, on one line:
      {"clients":[{"slug":"uniservice","region":"ap-south-2","rds_instances":[{"id":"db-1"}],"ec2_instances":[{"id":"i-0123"}]}]}.
      Add role_arn (and external_id) for clients in other AWS accounts.
    MaxLength: 4096
  ThresholdHours:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 336
    Description: Stop an environment once everything running in it has been up this many hours (max 336 = 14 days).
  DryRun:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "true = only log (and email) what would be stopped. Set to false once the logs look right."
  StopRule:
    Type: String
    Default: all
    AllowedValues: [all, any]
    Description: "all = every running resource must be over the limit; any = one is enough."
  Schedule:
    Type: String
    Default: cron(30 * * * ? *)
    Description: "EventBridge schedule, in UTC. cron(30 * * * ? *) = every hour at :30 UTC, which is :00 on India clocks (IST = UTC+5:30). Use cron(0 * * * ? *) for :00 UTC."
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional. Receives an email whenever something is stopped (or would be, in dry run) or a run fails. Confirm the subscription email.
  AdditionalEmails:
    Type: String
    Default: ""
    Description: Optional. Up to 4 more notification addresses, comma separated. Each must confirm its subscription email.
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda zip (deploy.py uploads it for you).
  CodeKey:
    Type: String
    Description: S3 key of the Lambda zip.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasExtra1: !Not [!Equals [!Select [0, !Split [",", !Sub "${AdditionalEmails},,,,"]], ""]]
  HasExtra2: !Not [!Equals [!Select [1, !Split [",", !Sub "${AdditionalEmails},,,,"]], ""]]
  HasExtra3: !Not [!Equals [!Select [2, !Split [",", !Sub "${AdditionalEmails},,,,"]], ""]]
  HasExtra4: !Not [!Equals [!Select [3, !Split [",", !Sub "${AdditionalEmails},,,,"]], ""]]
  HasAnyEmail: !Or [!Condition HasEmail, !Condition HasExtra1, !Condition HasExtra2, !Condition HasExtra3, !Condition HasExtra4]

Resources:
  Topic:
    Type: AWS::SNS::Topic
    Condition: HasAnyEmail
    Properties:
      TopicName: l180-auto-stop
      Subscription: !If
        - HasEmail
        - - Protocol: email
            Endpoint: !Ref NotificationEmail
        - !Ref AWS::NoValue

  ExtraSubscription1:
    Type: AWS::SNS::Subscription
    Condition: HasExtra1
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Select [0, !Split [",", !Sub "${AdditionalEmails},,,,"]]

  ExtraSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasExtra2
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Select [1, !Split [",", !Sub "${AdditionalEmails},,,,"]]

  ExtraSubscription3:
    Type: AWS::SNS::Subscription
    Condition: HasExtra3
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Select [2, !Split [",", !Sub "${AdditionalEmails},,,,"]]

  ExtraSubscription4:
    Type: AWS::SNS::Subscription
    Condition: HasExtra4
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Select [3, !Split [",", !Sub "${AdditionalEmails},,,,"]]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/l180-auto-stop
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: l180-auto-stop
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: auto-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Sid: Inspect
                Effect: Allow
                Action: [ec2:DescribeInstances, rds:DescribeDBInstances, rds:DescribeEvents, rds:ListTagsForResource]
                Resource: "*"
              - Sid: Stop
                Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*"
              - Sid: StopDatabases
                Effect: Allow
                Action: rds:StopDBInstance
                Resource: !Sub "arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:*"
              - Sid: ClientAccounts
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/l180-control-panel"
              - !If
                - HasAnyEmail
                - Sid: Notify
                  Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref Topic
                - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: l180-auto-stop
      Description: Stops client environments that have been up too long
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      MemorySize: 256
      Timeout: 900
      Environment:
        Variables:
          CLIENTS_JSON: !Ref ClientsJson
          THRESHOLD_HOURS: !Ref ThresholdHours
          DRY_RUN: !Ref DryRun
          STOP_RULE: !Ref StopRule
          SNS_TOPIC_ARN: !If [HasAnyEmail, !Ref Topic, ""]

  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: l180-auto-stop-schedule
      Description: Runs the auto-stop check
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      Targets:
        - Id: auto-stop
          Arn: !GetAtt Function.Arn

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn

Outputs:
  FunctionName:
    Value: !Ref Function
  LogGroupName:
    Value: !Ref LogGroup
  DryRun:
    Value: !Ref DryRun
